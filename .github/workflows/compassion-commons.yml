name: Compassion Commons experiment
on:
  pull_request:
    paths:
      - 'experiments/compassion-commons/**'
      - 'tests/compassion-commons.test.mjs'
      - 'tests/compassion-ledger.test.mjs'
      - 'tests/compassion-local-ledger.test.mjs'
      - 'tests/compassion-multi-resource.test.mjs'
      - 'tests/compassion-human-potential.test.mjs'
      - 'tests/compassion-federation.test.mjs'
      - 'tests/compassion-transition.test.mjs'
      - '.github/workflows/compassion-commons.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/compassion-commons.test.mjs tests/compassion-ledger.test.mjs tests/compassion-local-ledger.test.mjs tests/compassion-multi-resource.test.mjs tests/compassion-human-potential.test.mjs tests/compassion-federation.test.mjs tests/compassion-transition.test.mjs
